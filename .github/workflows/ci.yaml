name: Hudl Login Flow Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main] # Run on PRs targeting main branch

#  schedule:
#    - cron: "0 5 * * 4" # Run every Thursday at 5:00 AM UTC
  workflow_dispatch: #
    inputs:
      marker:
        description: "pytest marker: smoke | security | ui |  negative"
        required: false
        default: ""

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Continue running all jobs even if one fails
      matrix: #
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps
      - name: Run test suite
        env:
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: |
          pytest \
          --browser=${{ matrix.browser }} \
          ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '-m "smoke"' || github.event.inputs.marker && format('-m "{0}"', github.event.inputs.marker) || '' }} \
          --html=reports/report-${{ matrix.browser }}.html \
          --self-contained-html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: reports/
          retention-days: 2
