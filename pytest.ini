# pytest.ini common configuration file for pytest tests in this project
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -v

markers =
    smoke: fast, critical-path tests that must pass before any deployment
    security: security-focused tests (injection, XSS)
    ui: UI state and visual validation tests
    negative: negative / error-path scenarios
    mobile: tests that run on mobile browsers or emulators
