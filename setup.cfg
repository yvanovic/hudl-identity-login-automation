[flake8]
max-line-length = 100
extend-select = B  # flake8-bugbear
extend-ignore =
    # line too long — black handles this
    E501
    # function calls in default argument values (common in pytest fixtures)
    B008
per-file-ignores =
    # test files can have longer lines for parametrize ids and assertion messages
    tests/*:E501

[isort]
profile = black
line_length = 100
known_first_party = src,config
